<!DOCTYPE html>
<html>
<head>
    <title>Budget Tracker | Budget Tracker</title>
    <style>
        /* Existing CSS styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .headerBar {
            background-color: #4CAF50;
            color: white;
            padding: 10px 0;
            text-align: center;
            position: relative;
        }

        .title {
            margin: 0;
            font-size: 2em;
        }

        .topbar {
            margin: 5px 0;
            font-size: 1.2em;
        }

        .currency, .balance {
            font-size: 1.5em;
        }

        .buttonLogout {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
            border-radius: 4px;
            transition: background-color 0.3s;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .buttonLogout:hover {
            background-color: #d32f2f;
        }

        .content {
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            max-width: 800px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .secondTitle {
            margin: 0 0 20px 0;
            font-size: 1.8em;
            font-weight: 600;
        }

        .formLine {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .formLine span {
            margin-right: 10px;
            font-size: 1.1em;
            font-weight: 600;
        }

        .formLine input, .formLine select {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }

        .formLine input:focus, .formLine select:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }

        .buttonSave {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .buttonSave:hover {
            background-color: #45a049;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .table th, .table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 1em;
        }

        .table th {
            background-color: #f2f2f2;
            font-weight: 600;
        }

        .table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .table tr:hover {
            background-color: #f1f1f1;
        }

        .table .buttonDelete {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .table .buttonDelete:hover {
            background-color: #d32f2f;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .formLine {
                flex-direction: column;
                align-items: flex-start;
            }

            .formLine span, .formLine input, .formLine select {
                width: 100%;
            }

            .formLine span {
                margin-bottom: 5px;
            }

            .table th, .table td {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="headerBar">
        <header>
            <h1 class="title">Personal Budget Tracker</h1>
            <h2 class="topbar">Your Current Balance</h2>
            <p>
                <span class="currency">$</span>
                <span class="balance" id="netBalance">0.00</span>
            </p>
            <button class="buttonLogout">Logout</button>
        </header>
    </div>
    <div class="content">
        <h3 class="secondTitle">Totals:</h3>
        <p>Total Income: $<span id="totalIncome">0.00</span></p>
        <p>Total Expenses: $<span id="totalExpenses">0.00</span></p>
    </div>
    <div class="content">
        <h3 class="secondTitle">Add a new transaction: </h3>
        <div class="form">
            <form id="expForm">
                <div class="formLine left">
                    <span for="type">Type:</span>
                    <select id="type">
                        <option value="chooseOne">Choose one...</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="formLine right">
                    <span for="name">Name:</span>
                    <input type="text" id="name">
                </div>
                <div class="formLine right">
                    <span for="amount">Amount:</span>
                    <input type="text" id="amount">
                </div>
                <button type="submit" class="buttonSave">Add to transactions</button>
            </form>
        </div>
    </div>
    <div class="content">
        <table class="table">
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Options</th>
                </tr>
            </thead>
            <tbody id="transactionTable"></tbody>
        </table>
    </div>

    <script>
        // JavaScript code for managing budget data
        document.addEventListener('DOMContentLoaded', function() {
            // Check if the user is logged in
            if (localStorage.getItem('loggedIn') !== 'true') {
                window.location.href = 'login.html';
            }

            var currentUser = localStorage.getItem('currentUser'); // Get the current user

            if (currentUser) {
                // Load user's budget data from local storage
                var userData = JSON.parse(localStorage.getItem(currentUser + '_budgetData')) || [];

                // Display the user's budget data
                displayBudgetData(userData);
            }

            // Logout function
            document.querySelector('.buttonLogout').addEventListener('click', function() {
                localStorage.removeItem('loggedIn');
                localStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            });
        });

        function displayBudgetData(data) {
            var transactionTable = document.getElementById('transactionTable');
            transactionTable.innerHTML = '';
            data.forEach(function(transaction, index) {
                var row = `<tr>
                    <td>${transaction.type}</td>
                    <td>${transaction.name}</td>
                    <td>${transaction.amount}</td>
                    <td><button onclick="deleteTransaction(${index})" class="buttonDelete">Delete</button></td>
                </tr>`;
                transactionTable.innerHTML += row;
            });

            // Calculate and display totals
            calculateTotals(data);
        }

        function deleteTransaction(index) {
            var currentUser = localStorage.getItem('currentUser');
            var userData = JSON.parse(localStorage.getItem(currentUser + '_budgetData')) || [];
            userData.splice(index, 1);
            localStorage.setItem(currentUser + '_budgetData', JSON.stringify(userData));
            displayBudgetData(userData);
        }

        document.getElementById('expForm').addEventListener('submit', function(event) {
            event.preventDefault();
            var type = document.getElementById('type').value;
            var name = document.getElementById('name').value;
            var amount = document.getElementById('amount').value;

            var currentUser = localStorage.getItem('currentUser');
            var userData = JSON.parse(localStorage.getItem(currentUser + '_budgetData')) || [];

            userData.push({ type: type, name: name, amount: amount });
            localStorage.setItem(currentUser + '_budgetData', JSON.stringify(userData));

            displayBudgetData(userData);
            document.getElementById('expForm').reset();
        });

        function calculateTotals(data) {
            let totalIncome = 0;
            let totalExpenses = 0;

            data.forEach(transaction => {
                if (transaction.type === 'income') {
                    totalIncome += parseFloat(transaction.amount);
                } else if (transaction.type === 'expense') {
                    totalExpenses += parseFloat(transaction.amount);
                }
            });

            // Update the totals in the DOM
            document.getElementById('totalIncome').innerText = totalIncome.toFixed(2);
            document.getElementById('totalExpenses').innerText = totalExpenses.toFixed(2);
            document.getElementById('netBalance').innerText = (totalIncome - totalExpenses).toFixed(2);
        }
    </script>
</body>
</html>
