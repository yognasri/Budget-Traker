<!DOCTYPE html>
<html>
<head>
    <title>Login | Budget Tracker</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: white;
            padding: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .login-container h1 {
            margin-bottom: 20px;
            font-size: 2em;
            color: #333;
        }

        .login-container input {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }

        .login-container button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .login-container button:hover {
            background-color: #45a049;
        }

        .login-container p {
            margin-top: 20px;
        }

        .login-container a {
            color: #4CAF50;
            text-decoration: none;
        }

        .login-container a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: red;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <form id="loginForm">
            <input type="text" id="loginUsername" name="username" placeholder="Username" required>
            <input type="password" id="loginPassword" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p class="error-message" id="loginErrorMessage">Invalid username or password</p>
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            var username = document.getElementById('loginUsername').value;
            var password = document.getElementById('loginPassword').value;

            var users = JSON.parse(localStorage.getItem('users')) || [];

            var validUser = users.find(function(user) {
                return user.username === username && user.password === password;
            });

            if (validUser) {
                localStorage.setItem('loggedIn', 'true');
                window.location.href = 'budget.html';
            } else {
                document.getElementById('loginErrorMessage').style.display = 'block';
            }

        });
    </script>
    <script>
    // login.html - Handle login and set current user
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();
    
        var username = document.getElementById('loginUsername').value;
        var password = document.getElementById('loginPassword').value;
    
        var users = JSON.parse(localStorage.getItem('users')) || [];
    
        var validUser = users.find(function(user) {
            return user.username === username && user.password === password;
        });
    
        if (validUser) {
            localStorage.setItem('loggedIn', 'true');
            localStorage.setItem('currentUser', username); // Store the current user's username
            window.location.href = 'budget.html';
        } else {
            document.getElementById('loginErrorMessage').style.display = 'block';
            document.getElementById('loginErrorMessage').innerText = 'Invalid username or password';
        }
    });
</script>
    
</body>
</html>
